name: ChatGPT FX momentum review
on:
  push:
    paths:
      - 'scripts/ai_review.py'
      - '.github/workflows/ai-review.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
concurrency:
  group: fx-dashboard-ai-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AI review script
        run: python -m py_compile scripts/ai_review.py
      - name: Generate ChatGPT-only FX review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_review.py
      - name: Commit AI review snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_review.json
          if git diff --cached --quiet; then
            echo "AI review unchanged."
            exit 0
          fi
          git commit -m "Refresh ChatGPT FX momentum review"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: ChatGPT FX momentum review
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Selected pairs, comma-separated (e.g. EUR/USD,GBP/CAD). Leave blank for currency momentum only."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
concurrency:
  group: fx-dashboard-ai-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AI review script
        run: python -m py_compile scripts/ai_review.py
      - name: Generate selected ChatGPT review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PAIRS: ${{ inputs.pairs }}
        run: python scripts/ai_review.py
      - name: Commit AI review snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_review.json
          if git diff --cached --quiet; then
            echo "AI review unchanged."
            exit 0
          fi
          git commit -m "Refresh selected ChatGPT FX momentum review"
          git fetch origin main
          git reset --soft origin/main
          git add data/ai_review.json
          if git diff --cached --quiet; then
            echo "AI review already up to date."
            exit 0
          fi
          git commit -m "Refresh selected ChatGPT FX momentum review"
          git push origin HEAD:main

name: Refresh macro dashboard data
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_data.py'
      - 'scripts/update_us_macro.py'
      # The macro collector also imports the Forex Factory weekly economic calendar.
      - '.github/workflows/refresh.yml'
  schedule:
    # Five-minute target; GitHub scheduled runs are best-effort and may be delayed.
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: fx-dashboard-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate collector syntax
        run: |
          python -m py_compile scripts/update_data.py
          python -m py_compile scripts/update_us_macro.py
      - name: Build FX fundamentals snapshot
        run: python scripts/update_data.py
      - name: Build US macro snapshot
        run: python scripts/update_us_macro.py
      - name: Commit refreshed snapshots safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/us_macro.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "Refresh FX and US macro snapshots"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

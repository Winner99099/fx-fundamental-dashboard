name: Refresh US macro dashboard
on:
  workflow_dispatch:
  schedule:
    # Refresh market data periodically; official macro releases update only when published.
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect FRED and DXY data
        run: python scripts/update_us_macro.py
      - name: Commit refreshed US macro snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_macro.json
          git diff --cached --quiet || (git commit -m "Refresh US macro dashboard data" && git push)
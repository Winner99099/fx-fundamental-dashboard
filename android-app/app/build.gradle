plugins {
    id 'com.android.application'
}

 dependencies {
    implementation 'androidx.core:core:1.16.0'
}

android {
    namespace 'com.winner99099.macropulsefx'
    compileSdk 36

    defaultConfig {
        applicationId 'com.winner99099.macropulsefx'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
